plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'com.hbm.port'
base { archivesName = 'hbm-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('infrastructureClientSmoke')) systemProperty 'hbm.infrastructureClientSmoke', 'true'
            if (project.hasProperty('infrastructureReloadSmoke')) systemProperty 'hbm.infrastructureReloadSmoke', 'true'
            if (project.hasProperty('electricClientSmoke')) systemProperty 'hbm.electricClientSmoke', 'true'
            if (project.hasProperty('electricReloadSmoke')) systemProperty 'hbm.electricReloadSmoke', 'true'
            if (project.hasProperty('insulatorClientSmoke')) systemProperty 'hbm.insulatorClientSmoke', 'true'
            if (project.hasProperty('clientSmoke')) systemProperty 'hbm.clientSmoke', 'true'
            if (project.hasProperty('crateClientSmoke')) systemProperty 'hbm.crateClientSmoke', 'true'
            if (project.hasProperty('crateReloadSmoke')) systemProperty 'hbm.crateReloadSmoke', 'true'
            if (project.hasProperty('crateIsolationSmoke')) systemProperty 'hbm.crateIsolationSmoke', 'true'
            if (project.hasProperty('rawClientSmoke')) systemProperty 'hbm.rawClientSmoke', 'true'
            if (project.hasProperty('rawReloadSmoke')) systemProperty 'hbm.rawReloadSmoke', 'true'
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hbm'
            systemProperty 'hbm.resourceTestTools', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { hbm { sourceSet(sourceSets.main) } }
}
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}
dependencies {
    // Create's published POM also lists its optional development integrations.
    // The full Create JAR already embeds its required runtime libraries.
    implementation("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    // Create bundles Ponder at runtime; its block-entity interfaces are also needed by javac.
    compileOnly("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1") { transitive = false }
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    inputs.property 'neo_min_version', project.neo_min_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, neo_min_version: project.neo_min_version
    }
}
tasks.named('jar', Jar).configure {
    from('LICENSE', 'LICENSE.LESSER', 'NOTICE.md')
    // GameTests run from development sources, not from the player-facing JAR.
    exclude 'com/hbm/port/test/**'
    exclude 'data/hbm/structure/empty.nbt'
    exclude 'data/hbm/structure/ore_test.nbt'
    manifest.attributes('Implementation-Version': project.version)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
